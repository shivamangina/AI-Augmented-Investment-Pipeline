<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ thesis_name }} — Memo Index</title>
<style>{{ css|safe }}</style>
</head>
<body>
<main>
<h1>{{ thesis_name }}</h1>
<p class="subtitle">{{ rows|length }} companies analyzed.</p>

<div class="card">
<table class="index">
  <thead>
    <tr><th class="num">Score</th><th>Call</th><th>Company</th><th>Snapshot</th></tr>
  </thead>
  <tbody>
  {% for row in rows %}
    <tr>
      <td class="num score">{{ row.score }}</td>
      <td><span class="badge {{ row.call_class }}">{{ row.call }}</span></td>
      <td>
        <div class="company-cell">
          <span class="avatar" style="{{ row.avatar_style }}">{{ row.initial }}</span>
          <a href="{{ row.slug }}.html">{{ row.name }}</a>
        </div>
      </td>
      <td class="snapshot">{{ row.snapshot }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
</div>

</main>
</body>
</html>
